  width: min(1180px, 100%);

  display: flex;
  justify-content: space-between;
  align-items: flex-start;

.brand h1 {
  margin: 0;
  font-size: clamp(1.55rem, 4vw, 2.35rem);
  letter-spacing: -0.04em;
}

.brand p {

}

.privacy-badge {
  flex: 0 0 auto;
  border: 1px solid var(--panel-border);
  border-radius: 999px;

  background: rgba(14, 165, 233, .08);

.main-grid {

  grid-template-columns: minmax(0, 1fr) 320px;

.board-column { min-width: 0; }

.status-row {

  align-items: center;

.status {

.thinking {

}

.board-wrap {

  display: grid;
  place-items: center;

  height: 100%;
  min-width: 0;
  min-height: 0;

  padding: 0;

.square.dark { background: var(--dark-square); }
.square:focus-visible { outline: 4px solid #f8fafc; outline-offset: -4px; z-index: 8; }

.control-overlay {

.square.last-move::after,

  content: "";

  inset: 5px;
  border-radius: 10px;

  border: 5px solid rgba(15, 23, 42, .44);

.side-panel {

.button-stack { display: grid; gap: 9px; }

  <script>
'use strict';
const { Chess } = (() => {
const FILES = ['a','b','c','d','e','f','g','h'];
const PROMOTIONS = ['q','r','b','n'];

function clonePiece(piece) {
  return piece ? { ...piece } : null;
}

function squareToIndex(square) {
  if (!square || square.length !== 2) return null;
  const x = FILES.indexOf(square[0]);
  const y = Number(square[1]) - 1;
  if (x < 0 || y < 0 || y > 7) return null;
  return { x, y };
}

function indexToSquare(x, y) {
  if (x < 0 || x > 7 || y < 0 || y > 7) return null;
  return `${FILES[x]}${y + 1}`;
}

class Chess {
  constructor(fen = Chess.DEFAULT_POSITION) {
    this.load(fen);
  }

  static DEFAULT_POSITION = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

  load(fen) {
    const parts = fen.trim().split(/\s+/);
    if (parts.length < 4) throw new Error('Invalid FEN');
    const [placement, turn, castling, ep, halfmove = '0', fullmove = '1'] = parts;
    this.board = Array.from({ length: 8 }, () => Array(8).fill(null));
    const ranks = placement.split('/');
    if (ranks.length !== 8) throw new Error('Invalid FEN placement');

    for (let fenRank = 0; fenRank < 8; fenRank++) {
      let x = 0;
      const y = 7 - fenRank;
      for (const char of ranks[fenRank]) {
        if (/\d/.test(char)) {
          x += Number(char);
        } else {
          const color = char === char.toUpperCase() ? 'w' : 'b';
          const type = char.toLowerCase();
          this.board[y][x] = { color, type };
          x += 1;
        }
      }
      if (x !== 8) throw new Error('Invalid FEN rank');
    }

    this.turnColor = turn;
    this.castling = {
      K: castling.includes('K'), Q: castling.includes('Q'),
      k: castling.includes('k'), q: castling.includes('q'),
    };
    this.epSquare = ep === '-' ? null : ep;
    this.halfmoveClock = Number(halfmove) || 0;
    this.fullmoveNumber = Number(fullmove) || 1;
    this.moveStack = [];
    this.gameHistory = [];
    this.positionCounts = new Map();
    this._incrementPosition();
    return true;
  }

  reset() {
    return this.load(Chess.DEFAULT_POSITION);
  }

  get(square) {
    const idx = squareToIndex(square);
    if (!idx) return null;
    return clonePiece(this.board[idx.y][idx.x]);
  }

  put(piece, square) {
    const idx = squareToIndex(square);
    if (!idx || !piece || !['w','b'].includes(piece.color) || !'pnbrqk'.includes(piece.type)) return false;
    this.board[idx.y][idx.x] = clonePiece(piece);
    return true;
  }

  remove(square) {
    const idx = squareToIndex(square);
    if (!idx) return null;
    const piece = this.board[idx.y][idx.x];
    this.board[idx.y][idx.x] = null;
    return clonePiece(piece);
  }

  turn() { return this.turnColor; }

  history(options = {}) {
    return options.verbose ? this.gameHistory.map(m => ({ ...m })) : this.gameHistory.map(m => m.san || `${m.from}${m.to}`);
  }

  fen() {
    const rows = [];
    for (let y = 7; y >= 0; y--) {
      let row = '';
      let empty = 0;
      for (let x = 0; x < 8; x++) {
        const piece = this.board[y][x];
        if (!piece) {
          empty += 1;
          continue;
        }
        if (empty) { row += empty; empty = 0; }
        const letter = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
        row += letter;
      }
      if (empty) row += empty;
      rows.push(row);
    }
    const rights = ['K','Q','k','q'].filter(k => this.castling[k]).join('') || '-';
    return `${rows.join('/')} ${this.turnColor} ${rights} ${this.epSquare || '-'} ${this.halfmoveClock} ${this.fullmoveNumber}`;
  }

  _positionKey() {
    return this.fen().split(' ').slice(0, 4).join(' ');
  }

  _incrementPosition() {
    const key = this._positionKey();
    this.positionCounts.set(key, (this.positionCounts.get(key) || 0) + 1);
  }

  _decrementPosition() {
    const key = this._positionKey();
    const count = this.positionCounts.get(key) || 0;
    if (count <= 1) this.positionCounts.delete(key);
    else this.positionCounts.set(key, count - 1);
  }

  moves(options = {}) {
    let moves = this._legalMoves();
    if (options.square) moves = moves.filter(m => m.from === options.square);
    if (options.verbose) return moves.map(m => ({ ...m }));
    return moves.map(m => m.san || `${m.from}${m.to}${m.promotion || ''}`);
  }

  move(input) {
    if (!input) throw new Error('Move required');
    let from;
    let to;
    let promotion = 'q';
    if (typeof input === 'string') {
      const match = input.match(/^([a-h][1-8])([a-h][1-8])([qrbn])?$/i);
      if (!match) throw new Error('Only coordinate notation is supported');
      [, from, to, promotion = 'q'] = match;
    } else {
      ({ from, to } = input);
      promotion = input.promotion || promotion;
    }

    const candidates = this._legalMoves().filter(m => m.from === from && m.to === to);
    if (!candidates.length) throw new Error(`Illegal move: ${from}-${to}`);
    const chosen = candidates.find(m => !m.promotion || m.promotion === promotion) || candidates[0];
    const beforeTurn = this.turnColor;
    this._makeMove(chosen, true);
    const result = { ...chosen };
    result.san = input.skipSan ? `${result.from}${result.to}${result.promotion || ''}` : this._sanForMove(result, beforeTurn);
    this.gameHistory[this.gameHistory.length - 1].san = result.san;
    return result;
  }

  undo() {
    if (!this.moveStack.length) return null;
    this._decrementPosition();
    const record = this.moveStack.pop();
    const move = this.gameHistory.pop();
    this._restoreRecord(record);
    return move ? { ...move } : null;
  }

  withMove(move, fn) {
    const record = this._makeMove(move, false);
    try {
      return fn();
    } finally {
      this._restoreRecord(record);
    }
  }

  inCheck() {
    return this._isKingAttacked(this.turnColor);
  }

  isCheck() { return this.inCheck(); }

  isCheckmate() {
    return this.inCheck() && this._legalMoves().length === 0;
  }

  isStalemate() {
    return !this.inCheck() && this._legalMoves().length === 0;
  }

  isThreefoldRepetition() {
    return [...this.positionCounts.values()].some(count => count >= 3);
  }

  isInsufficientMaterial() {
    const pieces = [];
    for (let y = 0; y < 8; y++) {
      for (let x = 0; x < 8; x++) {
        const p = this.board[y][x];
        if (p) pieces.push({ ...p, x, y });
      }
    }
    const nonKings = pieces.filter(p => p.type !== 'k');
    if (nonKings.length === 0) return true;
    if (nonKings.length === 1 && ['b','n'].includes(nonKings[0].type)) return true;
    if (nonKings.every(p => p.type === 'b')) {
      const colors = new Set(nonKings.map(p => (p.x + p.y) % 2));
      return colors.size === 1;
    }
    return false;
  }

  isDraw() {

function evaluatePosition(chess) {

  for (const file of FILES) {
    for (const rank of RANKS) {
      const piece = chess.get(`${file}${rank}`);
      if (!piece) continue;

      if (piece.type === 'p') score += sign * (piece.color === 'w' ? y : 7 - y) * 3;

  if (chess.isDraw()) return 0;

  if (depth === 0 || chess.isGameOver()) return evaluatePosition(chess);

    for (const move of moves) {
      const score = chess.withMove(move, () => minimax(chess, depth - 1, alpha, beta, false));
      best = Math.max(best, score);
      alpha = Math.max(alpha, best);
      if (beta <= alpha) break;

  }

  let best = Infinity;
  for (const move of moves) {
    const score = chess.withMove(move, () => minimax(chess, depth - 1, alpha, beta, true));
    best = Math.min(best, score);
    beta = Math.min(beta, best);
    if (beta <= alpha) break;

  if (!moves.length) return null;

  if (depth === 1 && Math.random() < 0.42) {
    return moves[Math.floor(Math.random() * moves.length)];
  }

  let bestScore = computerColor === 'w' ? -Infinity : Infinity;
  let bestMoves = [];

  <div id="promotion-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
    <div class="modal promotion-modal">
      <button id="promotion-close" class="modal-close" aria-label="Cancel promotion">×</button>
      <p id="promotion-title" class="modal-copy"><strong>Choose a piece to promote to.</strong></p>
      <div id="promotion-choices" class="promotion-choices"></div>
    </div>
  </div>
`;

const boardEl = document.querySelector('#board');
const statusEl = document.querySelector('#status');
const thinkingEl = document.querySelector('#thinking');
const detailsEl = document.querySelector('#square-details');
const playAsEl = document.querySelector('#play-as');
const difficultyEl = document.querySelector('#difficulty');
const mapModeEl = document.querySelector('#map-mode');
const adModalEl = document.querySelector('#ad-modal');
const adMediaEl = document.querySelector('#ad-media');
const promotionModalEl = document.querySelector('#promotion-modal');
const promotionChoicesEl = document.querySelector('#promotion-choices');

function colorName(color) {
  return color === 'w' ? 'White' : 'Black';
}

function opposite(color) {
  return color === 'w' ? 'b' : 'w';
}

function squareToCoords(square) {
  return { x: FILES.indexOf(square[0]), y: Number(square[1]) - 1 };
}

function coordsToSquare(x, y) {
  if (x < 0 || x > 7 || y < 0 || y > 7) return null;
  return `${FILES[x]}${RANKS[y]}`;
}

function boardPieceAt(x, y) {
  const square = coordsToSquare(x, y);
  return square ? game.get(square) : null;
}

function pushAttack(map, square, attacker) {
  if (!square) return;
  map[square].push(attacker);
}

function generateAttackMap() {
  const map = {};
  for (const file of FILES) {
    for (const rank of RANKS) map[`${file}${rank}`] = [];
  }

  for (const file of FILES) {
    for (const rank of RANKS) {
      const from = `${file}${rank}`;
      const piece = game.get(from);
      if (!piece) continue;
      const { x, y } = squareToCoords(from);
      const attacker = { from, color: piece.color, type: piece.type };

      if (piece.type === 'p') {
        const direction = piece.color === 'w' ? 1 : -1;
        pushAttack(map, coordsToSquare(x - 1, y + direction), attacker);
        pushAttack(map, coordsToSquare(x + 1, y + direction), attacker);
      }

      if (piece.type === 'n') {
        const jumps = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
        for (const [dx, dy] of jumps) pushAttack(map, coordsToSquare(x + dx, y + dy), attacker);
      }

      if (piece.type === 'k') {
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (dx || dy) pushAttack(map, coordsToSquare(x + dx, y + dy), attacker);
          }
        }
      }

      if (['b', 'r', 'q'].includes(piece.type)) {
        const directions = [];
        if (['b', 'q'].includes(piece.type)) directions.push([1,1],[1,-1],[-1,1],[-1,-1]);
        if (['r', 'q'].includes(piece.type)) directions.push([1,0],[-1,0],[0,1],[0,-1]);

        for (const [dx, dy] of directions) {
          let nx = x + dx;
          let ny = y + dy;
          while (nx >= 0 && nx < 8 && ny >= 0 && ny < 8) {
            const target = coordsToSquare(nx, ny);
            pushAttack(map, target, attacker);
            if (boardPieceAt(nx, ny)) break;
            nx += dx;
            ny += dy;
          }
        }
      }
    }
  }
  return map;
}

function isControlMapVisible() {
  const mapMode = mapModeEl.value;
  return mapMode === 'always' || (mapMode === 'hold' && holdRevealActive);
}

function controlCounts(square, attackMap) {
  const attackers = attackMap[square];
  return {
    mine: attackers.filter(a => a.color === playerColor).length,
    theirs: attackers.filter(a => a.color === computerColor).length,
  };
}

function overlayColor({ mine, theirs }) {
  if (!mine && !theirs) return 'transparent';

  // Use fully opaque HSL colors instead of transparent overlays. This makes a
  // square with the same control count look identical on light and dark board
  // squares. Extra attackers still deepen the color in predictable steps.
  if (mine && !theirs) {
    const lightness = Math.max(48, 72 - (Math.min(mine, 4) - 1) * 8);
    return `hsl(215 66% ${lightness}%)`;
  }

  if (theirs && !mine) {
    const lightness = Math.max(48, 72 - (Math.min(theirs, 4) - 1) * 8);
    return `hsl(347 62% ${lightness}%)`;
  }

  const total = mine + theirs;
  const balance = (mine - theirs) / total; // +1 = blue, -1 = red
  const hue = balance >= 0
    ? 278 - balance * 58
    : 278 + (-balance) * 62;
  const lightness = Math.max(46, 68 - (Math.min(total, 6) - 2) * 5);
  return `hsl(${Math.round(hue)} 52% ${lightness}%)`;
}

function orientationSquares() {
  const ranks = playerColor === 'w' ? [...RANKS].reverse() : [...RANKS];
  const files = playerColor === 'w' ? [...FILES] : [...FILES].reverse();
  const squares = [];
  for (const rank of ranks) {
    for (const file of files) squares.push(`${file}${rank}`);
  }
  return { squares, files, ranks };
}

function renderBoard(focusOverride) {
  const attackMap = generateAttackMap();
  const controlVisible = isControlMapVisible();
  const { squares } = orientationSquares();
  const legalByTarget = new Map(legalTargets.map(move => [move.to, move]));

  const activeSquare = document.activeElement?.dataset?.square;
  if (activeSquare) focusedSquare = activeSquare;

  const targetSquare = focusOverride ?? (activeSquare ? focusedSquare : null);
  const rovingSquare = targetSquare ?? focusedSquare ?? squares[0];

  boardEl.innerHTML = '';
  for (const square of squares) {
    const { x, y } = squareToCoords(square);
    const piece = game.get(square);
    const isLight = (x + y) % 2 === 1;
    const squareEl = document.createElement('button');
    squareEl.type = 'button';
    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
    squareEl.dataset.square = square;
    squareEl.setAttribute('role', 'gridcell');
    squareEl.setAttribute('aria-label', describeSquare(square, attackMap));
    squareEl.tabIndex = square === rovingSquare ? 0 : -1;

    if (selectedSquare === square) squareEl.classList.add('selected');
    if (lastMove && (lastMove.from === square || lastMove.to === square)) squareEl.classList.add('last-move');

    const counts = controlCounts(square, attackMap);
    const overlay = document.createElement('span');
    overlay.className = 'control-overlay';
    overlay.style.backgroundColor = controlVisible ? overlayColor(counts) : 'transparent';
    squareEl.appendChild(overlay);

    if (controlVisible) {
      if (counts.mine) {
        const badge = document.createElement('span');
        badge.className = 'control-badge mine';
        badge.textContent = String(counts.mine);
        badge.setAttribute('aria-hidden', 'true');
        squareEl.appendChild(badge);
      }
      if (counts.theirs) {
        const badge = document.createElement('span');
        badge.className = 'control-badge theirs';
        badge.textContent = String(counts.theirs);
        badge.setAttribute('aria-hidden', 'true');
        squareEl.appendChild(badge);
      }
    }

    if (piece) {
      const pieceEl = document.createElement('span');
      pieceEl.className = `piece ${piece.color === 'w' ? 'white' : 'black'}`;
      pieceEl.textContent = PIECES[`${piece.color}${piece.type}`];
      pieceEl.setAttribute('aria-hidden', 'true');
      squareEl.appendChild(pieceEl);
    }

    if (legalByTarget.has(square)) {
      const dot = document.createElement('span');
      dot.className = `move-dot ${game.get(square) ? 'capture' : ''}`;
      squareEl.appendChild(dot);
    }

    const rankVisible = playerColor === 'w' ? square[0] === 'a' : square[0] === 'h';
    const fileVisible = playerColor === 'w' ? square[1] === '1' : square[1] === '8';
    if (rankVisible) {
      const rank = document.createElement('span');
      rank.className = 'coordinate rank';
      rank.textContent = square[1];
      squareEl.appendChild(rank);
    }
    if (fileVisible) {
      const file = document.createElement('span');
      file.className = 'coordinate file';
      file.textContent = square[0];
      squareEl.appendChild(file);
    }

    squareEl.addEventListener('click', () => onSquareClick(square));
    squareEl.addEventListener('mouseenter', () => {
      hoveredSquare = square;
      renderSquareDetails(square, attackMap);
    });
    squareEl.addEventListener('focus', () => {
      focusedSquare = square;
      renderSquareDetails(square, attackMap);
    });
    boardEl.appendChild(squareEl);
  }

  if (hoveredSquare) renderSquareDetails(hoveredSquare, attackMap);
  renderStatus();

  if (targetSquare) {
    focusedSquare = targetSquare;
    boardEl.querySelector(`[data-square="${targetSquare}"]`)?.focus({ preventScroll: true });
  }
}

function focusSquare(square) {
  const el = boardEl.querySelector(`[data-square="${square}"]`);
  if (!el) return;
  for (const btn of boardEl.querySelectorAll('.square')) btn.tabIndex = -1;
  el.tabIndex = 0;
  el.focus({ preventScroll: true });
}

function describeSquare(square, attackMap) {
  const piece = game.get(square);
  const { mine, theirs } = controlCounts(square, attackMap);
  const occupant = piece ? `${colorName(piece.color)} ${PIECE_NAMES[piece.type]}` : 'empty';
  return `${square}, ${occupant}, your coverage ${mine}, opponent coverage ${theirs}`;
}

function renderSquareDetails(square, attackMap) {
  const attackers = attackMap[square];
  const mine = attackers.filter(a => a.color === playerColor);
  const theirs = attackers.filter(a => a.color === computerColor);
  const format = list => list.length
    ? list.map(a => `${PIECE_NAMES[a.type]} on ${a.from}`).join(', ')
    : 'none';
  detailsEl.innerHTML = `
    <strong>${square.toUpperCase()}</strong><br>
    Your attackers (${mine.length}): ${format(mine)}<br>
    Opponent attackers (${theirs.length}): ${format(theirs)}
  `;
}

function clearSelection() {
  selectedSquare = null;
  legalTargets = [];
}

function onSquareClick(square) {
  if (isComputerThinking || game.isGameOver() || game.turn() !== playerColor || promotionPending) return;
  const piece = game.get(square);

  if (selectedSquare) {
    const matches = legalTargets.filter(move => move.to === square);
    if (matches.length > 1) {
      openPromotionPicker(selectedSquare, square);
      return;
    }
    if (matches.length === 1) {
      makePlayerMove(selectedSquare, square, matches[0].promotion);
      return;
    }
  }

  if (piece && piece.color === playerColor) {
    selectedSquare = square;
    legalTargets = game.moves({ square, verbose: true });
  } else {
    clearSelection();
  }
  renderBoard();
}

function makePlayerMove(from, to, promotion = 'q') {
  try {
    const move = game.move({ from, to, promotion });
    if (!move) return;
    lastMove = move;
    clearSelection();
    renderBoard();
    if (!game.isGameOver()) scheduleComputerMove();
  } catch {
    clearSelection();
    renderBoard();
  }
}

function openPromotionPicker(from, to) {
  promotionPending = { from, to };
  promotionChoicesEl.innerHTML = '';
  for (const type of PROMOTION_TYPES) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'promotion-choice';
    btn.setAttribute('aria-label', `Promote to ${PIECE_NAMES[type]}`);
    btn.textContent = PIECES[`${playerColor}${type}`];
    btn.addEventListener('click', () => resolvePromotion(type));
    promotionChoicesEl.appendChild(btn);
  }
  promotionModalEl.classList.remove('hidden');
  promotionChoicesEl.querySelector('button').focus();
}

function resolvePromotion(type) {
  const pending = promotionPending;
  promotionPending = null;
  promotionModalEl.classList.add('hidden');
  if (!pending) return;
  makePlayerMove(pending.from, pending.to, type);
  focusSquare(pending.to);
}

function cancelPromotion() {
  promotionModalEl.classList.add('hidden');
  promotionPending = null;
  renderBoard(selectedSquare);
}

function renderStatus() {
  if (game.isCheckmate()) {
    statusEl.textContent = `${colorName(opposite(game.turn()))} wins by checkmate.`;
    return;
  }
  if (game.isStalemate()) {
    statusEl.textContent = 'Draw by stalemate.';
    return;
  }
  if (game.isThreefoldRepetition()) {
    statusEl.textContent = 'Draw by threefold repetition.';
    return;
  }
  if (game.isInsufficientMaterial()) {
    statusEl.textContent = 'Draw by insufficient material.';
    return;
  }
  if (game.isDraw()) {
    statusEl.textContent = 'The game is a draw.';
    return;
  }

  const turn = colorName(game.turn());
  const check = game.inCheck() ? ' — check!' : '';
  statusEl.textContent = `${turn} to move${check}`;
}

function scheduleComputerMove() {
  if (game.turn() !== computerColor || game.isGameOver()) return;
  isComputerThinking = true;
  thinkingEl.classList.remove('hidden');
  renderBoard();

  setTimeout(() => {
    const depth = Number(difficultyEl.value);
    const move = chooseComputerMove(game, computerColor, depth);
    if (move) lastMove = game.move(move);
    isComputerThinking = false;
    thinkingEl.classList.add('hidden');
    renderBoard();
  }, 160);
}

function resolvePlayerColor() {
  const choice = playAsEl.value;
  if (choice === 'random') return Math.random() < 0.5 ? 'w' : 'b';
  return choice;
}

function startNewGame() {
  game = new Chess();
  playerColor = resolvePlayerColor();
  computerColor = opposite(playerColor);
  selectedSquare = null;
  legalTargets = [];
  lastMove = null;
  hoveredSquare = null;
  pendingNewGame = false;
  promotionPending = null;
  promotionModalEl.classList.add('hidden');
  isComputerThinking = false;
  thinkingEl.classList.add('hidden');
  renderBoard();
  trackEvent('game_start', {
    player_color: playerColor === 'w' ? 'white' : 'black',
    computer_strength: difficultyEl.value,
    control_map: mapModeEl.value,
  });
  if (computerColor === 'w') scheduleComputerMove();
}

function renderAdCreative() {
  adMediaEl.innerHTML = '';
  const media = document.createElement(AD_CONFIG.type === 'video' ? 'video' : 'img');
  media.className = 'ad-creative';
  media.src = AD_CONFIG.src;
  if (AD_CONFIG.type === 'video') {
    media.controls = true;
    media.muted = true;
    media.playsInline = true;
    media.preload = 'metadata';
    media.setAttribute('aria-label', AD_CONFIG.alt);
  } else {
    media.alt = AD_CONFIG.alt;
  }

  if (AD_CONFIG.clickUrl) {
    const link = document.createElement('a');
    link.href = AD_CONFIG.clickUrl;
    link.target = '_blank';
    link.rel = 'noopener sponsored';
    link.appendChild(media);
    adMediaEl.appendChild(link);
  } else {
    adMediaEl.appendChild(media);
  }
}

function requestNewGameWithAd() {
  if (pendingNewGame || promotionPending) return;
  pendingNewGame = true;
  trackEvent('ad_opportunity', { placement: 'new_game' });
  renderAdCreative();
  adModalEl.classList.remove('hidden');
  document.querySelector('#ad-close').focus();
}

function closeAdAndStart() {
  trackEvent('ad_closed', { placement: 'new_game' });
  adModalEl.classList.add('hidden');
  startNewGame();
}

function takeBack() {
  if (isComputerThinking || promotionPending) return;
  if (!game.history().length) return;
  if (playerColor === 'b' && game.history().length === 1) return;

  game.undo();
  if (game.turn() !== playerColor && game.history().length) game.undo();
  lastMove = null;
  clearSelection();
  trackEvent('take_back');
  renderBoard();
}

document.querySelector('#new-game').addEventListener('click', requestNewGameWithAd);
document.querySelector('#undo').addEventListener('click', takeBack);
document.querySelector('#ad-close').addEventListener('click', closeAdAndStart);
document.querySelector('#ad-continue').addEventListener('click', closeAdAndStart);
document.querySelector('#promotion-close').addEventListener('click', cancelPromotion);
mapModeEl.addEventListener('change', () => renderBoard());

const BOARD_ARROW_DELTAS = {
  ArrowUp: { dx: 0, dy: -1 },
  ArrowDown: { dx: 0, dy: 1 },
  ArrowLeft: { dx: -1, dy: 0 },
  ArrowRight: { dx: 1, dy: 0 },
};

function moveBoardFocus(key) {
  const current = document.activeElement?.dataset?.square;
  if (!current) return;
  const { squares } = orientationSquares();
  const index = squares.indexOf(current);
  if (index === -1) return;
  const { dx, dy } = BOARD_ARROW_DELTAS[key];
  const row = Math.min(7, Math.max(0, Math.floor(index / 8) + dy));
  const col = Math.min(7, Math.max(0, (index % 8) + dx));
  focusSquare(squares[row * 8 + col]);
}

window.addEventListener('keydown', event => {
  if (event.code === 'Space' && mapModeEl.value === 'hold' && !event.repeat) {
    event.preventDefault();
    holdRevealActive = true;
    renderBoard();
  }
  if (event.key === 'Escape' && !adModalEl.classList.contains('hidden')) closeAdAndStart();
  if (event.key === 'Escape' && promotionPending) cancelPromotion();

  if (BOARD_ARROW_DELTAS[event.key] && boardEl.contains(document.activeElement)) {
    event.preventDefault();
    moveBoardFocus(event.key);
  }
});
window.addEventListener('keyup', event => {
  if (event.code === 'Space' && mapModeEl.value === 'hold') {
    holdRevealActive = false;
    renderBoard();
  }
});
window.addEventListener('blur', () => {
  if (holdRevealActive) {
    holdRevealActive = false;
    renderBoard();
  }
});

startNewGame();

  </script>
</body>
</html>
